<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="/vendor/fonts.css">
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#FBF8F2;font-family:"Public Sans",sans-serif;color:#1B2130;position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:0;bottom:0;width:14px;background:#2E4C82}

.mark{width:46px;height:46px;border-radius:13px;background:#2E4C82;color:#fff;display:grid;place-items:center;font-size:28px}
